when:
  - event: [push, pull_request]

steps:
  - name: check
    image: python:3.12-alpine
    commands:
      - python -m pip install --no-cache-dir --disable-pip-version-check -e ".[dev]"
      - python -m ruff check .
      - python -m unittest discover -s tests -v
      - python -m ameli_extract --help
